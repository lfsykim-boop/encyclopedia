<!doctype html>
<html lang="ko">
<head>
<link rel="prefetch" href="data:,Jua">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밀가루 대백과</title>
<meta name="description" content="밀가루의 역사, 기능, 종류, 구조를 44개 표제어로 정리한 백과사전. 초등학교 3학년이 읽을 수 있는 쉬운 설명.">
<style>
:root{
  --scale:1;
  --bg:#F3EADB;
  --surface:#F3EADB;
  --sd:#d5c4a6;
  --sl:#ffffff;
  --ink:#4a3725;
  --ink-soft:#7a6248;
  --accent:#d9822b;
  --accent-ink:#ffffff;
  --line:rgba(122,98,72,.18);
  --focus:#e0782a;
  --overlay:rgba(60,42,22,.45);
  --clay-ink:#3b2a1a;
  --clay-hi:rgba(255,255,255,.6);
  --clay-lo:rgba(90,60,30,.18);
  --clay-drop:rgba(120,90,50,.28);
  --c-kind:#F6C76E; --c-ing:#A6D8AE; --c-proc:#94C9EC; --c-food:#F6A98F; --c-sci:#C7ADEB; --c-hist:#F3AECB; --c-etc:#E6D3B3;
  /* 대주제 8개 톤 팔레트 (차분한 톤) */
  --ct0:#E8E3C8; --ct1:#ECDDE2; --ct2:#EFE0D2; --ct3:#E3E6D3; --ct4:#E5E0EC; --ct5:#EEDFDB; --ct6:#F0DDD6; --ct7:#DDE3EA;
  --r-sm:18px; --r-md:24px; --r-lg:28px;
  --raised:7px 7px 16px var(--sd),-7px -7px 16px var(--sl);
  --raised-sm:4px 4px 10px var(--sd),-4px -4px 10px var(--sl);
  --pressed:inset 4px 4px 10px var(--sd),inset -4px -4px 10px var(--sl);
  --clay:inset -3px -5px 8px var(--clay-lo),inset 3px 4px 7px var(--clay-hi),5px 7px 14px var(--clay-drop);
  --clay-pressed:inset 3px 4px 8px var(--clay-lo),inset -2px -3px 6px var(--clay-hi);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a231c; --surface:#2a231c; --sd:#1a150f; --sl:#3a3026;
    --ink:#f3e6d1; --ink-soft:#c9b394; --accent:#f0a24a; --accent-ink:#2a1b0c;
    --line:rgba(243,230,209,.14); --focus:#f6b562; --overlay:rgba(0,0,0,.6);
    --clay-hi:rgba(255,255,255,.35); --clay-lo:rgba(0,0,0,.25); --clay-drop:rgba(0,0,0,.45);
    --c-kind:#e3b55e; --c-ing:#8fc39a; --c-proc:#82b6d8; --c-food:#e5937a; --c-sci:#b39ad8; --c-hist:#de99b7; --c-etc:#cdb995;
    --ct0:#3B3A28; --ct1:#3C2E33; --ct2:#3E3328; --ct3:#353829; --ct4:#35303D; --ct5:#3D302C; --ct6:#3F2E29; --ct7:#2C333B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2a231c; --surface:#2a231c; --sd:#1a150f; --sl:#3a3026;
  --ink:#f3e6d1; --ink-soft:#c9b394; --accent:#f0a24a; --accent-ink:#2a1b0c;
  --line:rgba(243,230,209,.14); --focus:#f6b562; --overlay:rgba(0,0,0,.6);
  --clay-hi:rgba(255,255,255,.35); --clay-lo:rgba(0,0,0,.25); --clay-drop:rgba(0,0,0,.45);
  --c-kind:#e3b55e; --c-ing:#8fc39a; --c-proc:#82b6d8; --c-food:#e5937a; --c-sci:#b39ad8; --c-hist:#de99b7; --c-etc:#cdb995;
  --ct0:#3B3A28; --ct1:#3C2E33; --ct2:#3E3328; --ct3:#353829; --ct4:#35303D; --ct5:#3D302C; --ct6:#3F2E29; --ct7:#2C333B;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(100% * var(--scale));scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Gowun Dodum","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:1.125rem;line-height:1.8;overflow-x:clip;
  word-break:keep-all;overflow-wrap:break-word;
}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;line-height:1.3;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* ---------- 대주제 색 (8개) ---------- */
.ct-0{--c:var(--ct0)}.ct-1{--c:var(--ct1)}.ct-2{--c:var(--ct2)}.ct-3{--c:var(--ct3)}
.ct-4{--c:var(--ct4)}.ct-5{--c:var(--ct5)}.ct-6{--c:var(--ct6)}.ct-7{--c:var(--ct7)}
.ico{display:inline-block;vertical-align:-.2em;flex:none}

/* ---------- neumorphic primitives ---------- */
.raised{background:var(--surface);box-shadow:var(--raised);border-radius:var(--r-md)}
.nbtn{
  min-height:48px;min-width:48px;padding:.4rem 1rem;border-radius:var(--r-sm);
  background:var(--surface);box-shadow:var(--raised-sm);
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:"Jua",sans-serif;font-size:1rem;line-height:1.2;
  transition:box-shadow .18s ease,transform .18s ease;
}
.nbtn:hover{transform:translateY(-1px)}
.nbtn:active,.nbtn[aria-pressed="true"]{box-shadow:var(--pressed);transform:none}
.nbtn[disabled],.nbtn[aria-disabled="true"]{opacity:.4;cursor:not-allowed;transform:none}

.chip{
  --c:var(--ct0);
  display:inline-flex;align-items:center;gap:.3rem;
  background:var(--c);color:var(--clay-ink);
  border-radius:999px;padding:.15rem .8rem;font-family:"Jua",sans-serif;font-size:.9rem;line-height:1.6;
  box-shadow:var(--clay);white-space:nowrap;
}

/* ---------- header ---------- */
.site-head{padding:24px 0 8px}
.head-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{
  flex:none;width:64px;height:64px;border-radius:22px;display:grid;place-items:center;
  background:var(--ct0);color:var(--accent);box-shadow:var(--clay);
}
.brand-mark .ico{width:36px;height:36px}
.brand h1{font-size:clamp(1.6rem,5vw,2.4rem)}
.intro{margin:.15rem 0 0;color:var(--ink-soft);font-size:1rem;line-height:1.6}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools .nbtn{padding:.4rem .8rem}

/* ---------- hero video ---------- */
.hero{padding:16px 0 8px}
.video-frame{padding:14px;border-radius:var(--r-lg);background:var(--ct0);box-shadow:var(--clay)}
#video{position:relative;width:100%;border-radius:20px}
#video:has(.video-ph){aspect-ratio:16/9;overflow:hidden;background:var(--surface);box-shadow:var(--pressed)}
#video > iframe,#video > video,#video > canvas{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.video-ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--ink-soft)}
.video-ph p{margin:.4rem 0 0;font-family:"Jua",sans-serif;font-size:1.1rem}

/* ---------- sticky 대주제 탭 ---------- */
.catbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line)}
.catbar .wrap{position:relative}
.cat-scroll{
  display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;
  padding:8px 6px 10px;scrollbar-width:thin;
}
.cat-tab{
  --c:var(--surface);
  flex:none;min-height:48px;padding:.3rem 1.05rem .3rem .8rem;border-radius:999px;scroll-snap-align:center;
  display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;
  background:var(--surface);box-shadow:var(--raised-sm);
  font-family:"Jua",sans-serif;font-size:1rem;line-height:1.2;
  transition:box-shadow .18s,background .18s,color .18s,transform .18s;
}
.cat-tab .tt{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--c);color:var(--clay-ink)}
.cat-tab .tt .ico{width:20px;height:20px}
.cat-tab:hover:not(:disabled){transform:translateY(-2px)}
.cat-tab.active{background:var(--accent);color:var(--accent-ink);box-shadow:var(--clay)}
.cat-tab:disabled{opacity:.35;cursor:default;transform:none}

/* ---------- controls ---------- */
.controls{padding:20px 0 4px;display:grid;gap:16px}
.search{
  display:flex;align-items:center;gap:10px;padding:0 16px;min-height:58px;border-radius:999px;
  background:var(--surface);box-shadow:var(--pressed);
}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:1.05rem;padding:12px 0}
.search input::placeholder{color:var(--ink-soft);opacity:.85}
.search:focus-within{outline:3px solid var(--focus);outline-offset:3px}
.clear-q{width:44px;height:44px;border-radius:50%;font-size:1.1rem}
.filters,.cho{display:flex;flex-wrap:wrap;gap:10px}
.fgroup-t{margin:0 0 6px;font-family:"Jua",sans-serif;font-size:.95rem;color:var(--ink-soft)}
.fchip{
  --c:var(--surface);
  min-height:48px;padding:.3rem 1rem;border-radius:999px;
  background:var(--surface);box-shadow:var(--raised-sm);
  font-family:"Jua",sans-serif;font-size:1rem;display:inline-flex;align-items:center;gap:.4rem;
  transition:box-shadow .18s,background .18s,transform .18s;
}
.fchip .n{font-size:.8rem;min-width:1.8em;padding:0 .4em;border-radius:999px;background:var(--line);text-align:center;line-height:1.6}
.fchip[aria-pressed="true"]{background:var(--c);color:var(--clay-ink);box-shadow:var(--clay-pressed)}
.fchip[aria-pressed="true"].all{--c:var(--accent);color:var(--accent-ink)}
.fchip:disabled{opacity:.4;cursor:default}
.cho-btn{
  min-width:48px;min-height:48px;padding:0 .5rem;border-radius:50%;
  background:var(--surface);box-shadow:var(--raised-sm);
  font-family:"Jua",sans-serif;font-size:1.15rem;line-height:1;
  transition:box-shadow .18s,background .18s,transform .18s;
}
.cho-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--clay-pressed)}
.cho-btn:disabled{opacity:.3;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.status{color:var(--ink-soft);font-size:.95rem;margin:0}
.linkish{text-decoration:underline;text-underline-offset:3px;font-family:"Jua",sans-serif;min-height:48px;padding:0 .3rem;color:var(--accent)}

/* ---------- 대주제 섹션 / 카드 ---------- */
.topic{margin:36px 0 0;scroll-margin-top:84px}
.topic-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topic-tile{
  flex:none;width:56px;height:56px;border-radius:20px;display:grid;place-items:center;
  background:var(--c);color:var(--clay-ink);box-shadow:var(--clay);
}
.topic-tile .ico{width:32px;height:32px}
.topic-tt{min-width:0;flex:1}
.topic-tt h2{font-size:clamp(1.35rem,4.5vw,1.8rem)}
.topic-tt p{margin:.1rem 0 0;color:var(--ink-soft);font-size:1rem;line-height:1.6;max-width:42em}
.topic-n{flex:none;font-family:"Jua",sans-serif;font-size:.95rem;color:var(--ink-soft);padding:.15rem .8rem;border-radius:999px;box-shadow:var(--pressed)}
.grid{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.card{position:relative;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--raised);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px)}
.card:has(.card-open:active){box-shadow:var(--pressed);transform:none}
.card-open{display:block;width:100%;height:100%;text-align:left;padding:20px 20px 18px;border-radius:var(--r-lg)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-right:52px}
.tile{
  flex:none;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;
  background:var(--c);color:var(--clay-ink);box-shadow:var(--clay);
}
.tile .ico{width:30px;height:30px}
.card-word{display:block;font-family:"Jua",sans-serif;font-size:1.45rem;line-height:1.3}
.card-en{display:block;color:var(--ink-soft);font-size:.9rem;line-height:1.5}
.card-sum{display:-webkit-box;margin:10px 0 14px;font-size:1rem;line-height:1.7;
  -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fav{
  position:absolute;top:14px;right:14px;z-index:2;width:48px;height:48px;border-radius:50%;
  background:var(--surface);box-shadow:var(--raised-sm);font-size:1.35rem;line-height:1;
  opacity:.75;transition:box-shadow .18s,opacity .18s,transform .18s,color .18s;
}
.fav[aria-pressed="true"]{color:var(--accent);opacity:1;box-shadow:var(--pressed)}
.fav:active{transform:scale(.92)}
.empty{text-align:center;padding:44px 16px;margin-top:28px;border-radius:var(--r-lg);box-shadow:var(--pressed)}
.empty h2{font-size:1.5rem;margin:.2rem 0 .2rem}
.empty p{margin:0 0 1rem;color:var(--ink-soft)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-bg{position:absolute;inset:0;background:var(--overlay);animation:fade .2s ease}
.sheet{
  position:relative;width:100%;max-width:760px;max-height:calc(100dvh - 32px);overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:var(--r-lg);box-shadow:0 20px 50px rgba(0,0,0,.3),var(--raised);
  padding:20px 22px 24px;animation:pop .22s ease;
}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sheet-bar .left,.sheet-bar .right{display:flex;gap:10px;flex-wrap:wrap}
.d-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:6px 0 14px}
.d-tile{
  flex:none;width:96px;height:96px;border-radius:30px;display:grid;place-items:center;
  background:var(--c);color:var(--clay-ink);box-shadow:var(--clay);
}
.d-tile .ico{width:56px;height:56px}
.d-titles{min-width:0;flex:1}
.d-word{font-size:clamp(1.7rem,6vw,2.3rem)}
.d-en{margin:.2rem 0 .5rem;color:var(--ink-soft);font-size:1.1rem}
.d-sum{font-size:1.15rem;margin:0 0 1rem;max-width:36em;font-weight:700}
.d-body p{margin:0 0 1.1em;max-width:36em}
.callout{margin:18px 0;padding:16px 18px;border-radius:var(--r-md);background:var(--c);color:var(--clay-ink);box-shadow:var(--clay);max-width:38em}
.callout h3{font-size:1.2rem;margin-bottom:.3rem}
.callout p{margin:0}
.call-fun{--c:var(--ct0)}
.call-try{--c:var(--ct3)}
.related{margin:22px 0 8px}
.related h3{font-size:1.15rem;margin-bottom:.6rem}
.rel-list{display:flex;flex-wrap:wrap;gap:10px}
.rel-btn{border-radius:999px;padding:.3rem 1rem .3rem .4rem}
.rel-btn .b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--clay-ink);box-shadow:var(--clay)}
.rel-btn .b .ico{width:22px;height:22px}
.d-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.d-nav .nbtn{flex:1;max-width:48%;min-width:0}
.d-nav .nbtn span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{margin:12px 0 0;text-align:center;color:var(--ink-soft);font-size:.85rem}
@media (max-width:640px){
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:94dvh;padding:16px 16px 22px}
  .d-tile{width:76px;height:76px;border-radius:24px}
  .d-tile .ico{width:44px;height:44px}
  .hint{display:none}
}
body.lock{overflow:hidden}

/* ---------- back to top & footer ---------- */
.totop{
  position:fixed;right:16px;bottom:16px;z-index:40;width:60px;height:60px;border-radius:22px;
  background:var(--accent);color:var(--accent-ink);box-shadow:var(--clay);font-family:"Jua",sans-serif;font-size:.85rem;line-height:1.1;
  display:grid;place-items:center;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .25s,transform .25s;
}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop .arr{font-size:1.4rem;display:block}
.site-foot{margin:48px 0 0;padding:28px 0 96px;color:var(--ink-soft);font-size:.95rem;border-top:1px solid var(--line);text-align:center}
.site-foot p{margin:.2rem auto;max-width:36em}

@media (max-width:420px){
  .tools .nbtn .lbl{display:none}
  .brand-mark{width:54px;height:54px;border-radius:18px}
  .brand-mark .ico{width:30px;height:30px}
}
.d-facts,.d-words,.d-more{margin:22px 0;padding:18px 20px;border-radius:var(--r-md);background:var(--md-surface-c,var(--surface));box-shadow:var(--raised-sm)}
.d-facts h3,.d-words h3,.d-more h3{margin:0 0 10px;font-size:1.2rem}
.d-facts dl,.d-words dl{margin:0;display:grid;gap:8px}
.d-facts dl>div{display:grid;grid-template-columns:minmax(5.5em,32%) 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.d-facts dl>div:last-child{border-bottom:0}
.d-facts dt,.d-words dt{font-weight:700;color:var(--accent)}
.d-facts dd,.d-words dd{margin:0}
.d-words dl>div{padding:6px 0}
.d-more details{padding:10px 14px;margin:8px 0;border-radius:var(--r-sm);background:var(--md-surface-low,var(--bg))}
.d-more summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
.d-more details p{margin:8px 0 0}
@media (max-width:480px){.d-facts dl>div{grid-template-columns:1fr;gap:2px}}
</style>
<style>/* theme-materialyou.css */
/* Material You (M3) theme layer — seed: wheat amber. Overrides shell tokens. */
@font-face{font-family:"SeoulNamsan";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff") format("woff");font-weight:normal;font-style:normal;font-display:swap}

:root{
  --md-primary:#8C4F00; --md-on-primary:#FFFFFF;
  --md-primary-container:#FFDCBE; --md-on-primary-container:#2D1600;
  --md-secondary-container:#FBDDC3; --md-tertiary-container:#DCE8B4; --md-tertiary:#58633A;
  --md-surface:#FBF8F5; --md-surface-low:#F6F1EC; --md-surface-c:#F1EBE5; --md-surface-high:#EBE4DD;
  --md-on-surface:#221A14; --md-on-surface-var:#52443A; --md-outline:#D7C3B5;

  --bg:var(--md-surface); --surface:var(--md-surface-low);
  --ink:var(--md-on-surface); --ink-soft:var(--md-on-surface-var);
  --accent:var(--md-primary); --accent-ink:var(--md-on-primary); --focus:var(--md-primary);
  --line:var(--md-outline); --overlay:rgba(34,26,20,.42);
  --clay-ink:var(--md-on-primary-container);
  --c-kind:#FFDCBE; --c-ing:#DCE8B4; --c-proc:#CDE5FF; --c-food:#FFDAD4; --c-sci:#E9DDFF; --c-hist:#FFD8E8; --c-etc:#F0E0D0;
  --r-sm:20px; --r-md:28px; --r-lg:32px;
  --raised:0 1px 2px rgba(34,26,20,.10),0 2px 8px rgba(140,79,0,.08);
  --raised-sm:0 1px 2px rgba(34,26,20,.10);
  --pressed:inset 0 0 0 1px var(--md-outline);
  --clay:0 1px 2px rgba(34,26,20,.12);
  --clay-pressed:inset 0 0 0 2px rgba(34,26,20,.12);
  /* overview (fg-) tokens */
  --text:var(--md-on-surface); --accent2:var(--md-tertiary);
  --shadow-dark:rgba(140,79,0,.10); --shadow-light:rgba(255,255,255,0);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --md-primary:#FFB870; --md-on-primary:#4A2800;

  /* ---------------- 도우미 ---------------- */

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 항목 id 로 이동하는 링크 (클릭 시 location.hash = id)
  function entryLink(id, label) {
    return '<a class="fg-link" href="#' + esc(id) + '" data-fg-id="' + esc(id) + '"' +
      (label ? ' aria-label="' + esc(label) + ' 항목 자세히 보기"' : '') + '>자세히 보기' + ico('arrow') + '</a>';
  }

  function chip(name) {
    return '<span class="fg-chip" aria-hidden="true">' + ico(name) + '</span>';
  }

  function injectStyle() {
    if (document.getElementById('fg-style')) return;
    var st = document.createElement('style');
    st.id = 'fg-style';
    st.textContent = CSS;
    document.head.appendChild(st);
  }

  /* ---------------- 각 절 그리기 ---------------- */

  function htmlHistory() {
    var items = HISTORY.map(function (h, i) {
      return '<li class="fg-tli" data-i="' + i + '">' +
        '<button type="button" class="fg-tlbtn" aria-expanded="false" aria-controls="fg-tl-' + i + '">' +
        chip(h.icon) +
        '<span><span class="fg-tlwhen">' + esc(h.when) + '</span><span class="fg-tltitle">' + esc(h.title) + '</span></span>' +
        '<span class="fg-tlarrow" aria-hidden="true">' + ico('chevron') + '</span></button>' +
        '<div class="fg-tlbody" id="fg-tl-' + i + '" hidden><p>' + esc(h.text) + '</p>' + entryLink(h.link, h.word) + '</div>' +
        '</li>';
    }).join('');
    return '<p class="fg-lead">밀가루는 아주 오랜 시간 동안 사람의 먹을거리였습니다. 연표의 각 항목을 누르면 내용이 펼쳐집니다.</p>' +
      '<ol class="fg-tl">' + items + '</ol>';
  }

  function htmlFunction() {
    var cards = FUNCTIONS.map(function (f) {
      return '<article class="fg-card">' +
        chip(f.icon) +
        '<h3>' + esc(f.title) + '</h3>' +
        '<span class="fg-sub">' + esc(f.sub) + '</span>' +
        '<p>' + esc(f.text) + '</p>' +
        entryLink(f.link, f.word) +
        '</article>';
    }).join('');
    return '<p class="fg-lead">밀가루는 단순한 흰 가루가 아닙니다. 음식을 만들 때 아래와 같은 여섯 가지 기능을 합니다.</p>' +
      '<div class="fg-grid">' + cards + '</div>';
  }

  function barHtml(t) {
    var parts = t.protein.split(' (');
    if (!t.bar) {
      return '<p class="fg-nobar">단백질 ' + esc(parts[0]) + (parts[1] ? ' (' + esc(parts[1]) : '') + '</p>';
    }
    var max = 16;
    var left = (t.lo / max * 100).toFixed(2);
    return '<div class="fg-bar" role="img" aria-label="단백질 ' + esc(t.protein) + '">' +
      '<div class="fg-barlabel"><span>단백질 함량</span><b>' + esc(parts[0]) + '</b></div>' +
      '<div class="fg-track"><span class="fg-rail">' +
      '<span class="fg-fill" data-w="' + ((t.hi - t.lo) / max * 100).toFixed(2) + '" style="left:' + left + '%"></span></span></div>' +
      '<div class="fg-barlabel"><span>0%</span><span>8%</span><span>16%</span></div>' +
      '</div>';
  }

  function htmlTypes() {
    var rows = TYPES.map(function (t) {
      return '<tr><td><a class="fg-tlink" href="#' + t.link + '" data-fg-id="' + t.link + '">' + ico(t.icon) + esc(t.name) + '</a></td><td>' +
        esc(t.protein) + '</td><td>' + esc(t.feel) + '</td><td>' + esc(t.foods) + '</td></tr>';
    }).join('');
    var table = '<div class="fg-tablewrap" role="region" aria-label="밀가루 종류 비교표" tabindex="0">' +
      '<table class="fg-table"><thead><tr><th>이름</th><th>단백질</th><th>특징</th><th>주요 용도</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
    var cards = TYPES.map(function (t, i) {
      return '<article class="fg-card fg-tcard">' +
        '<button type="button" class="fg-tbtn" aria-expanded="false" aria-controls="fg-ty-' + i + '">' +
        chip(t.icon) +
        '<span><span class="fg-tname">' + esc(t.name) + '</span><span class="fg-tprot">' + esc(t.foods) + '</span></span>' +
        '<span class="fg-tarrow" aria-hidden="true">' + ico('chevron') + '</span></button>' +
        barHtml(t) +
        '<div class="fg-tbody" id="fg-ty-' + i + '" hidden>' +
        '<p>' + esc(t.text) + '</p>' +
        '<dl><dt>단백질</dt><dd>' + esc(t.protein) + '</dd><dt>특징</dt><dd>' + esc(t.feel) + '</dd></dl>' +
        entryLink(t.link, t.name) +
        '</div></article>';
    }).join('');
    return '<p class="fg-lead">밀가루는 단백질(글루텐의 재료)이 얼마나 들어 있느냐에 따라 이름이 나뉩니다. 단백질이 많을수록 반죽이 더 쫄깃합니다. 단단한 밀로는 강력분을, 무른 밀로는 박력분을 만듭니다.</p>' +
      table +
      '<div class="fg-tcards">' + cards + '</div>' +
      '<p class="fg-note">' + ico('layers') + '<span>단백질 함량의 기준은 나라와 회사마다 다릅니다. 구입할 때는 봉지 뒤의 영양 정보를 확인하는 것이 좋습니다.</span></p>' +
      '<div class="fg-note">' + ico('flame') + '<div><p>회분으로 나누는 나라도 있습니다. 밀가루를 아주 뜨거운 오븐에서 태우면 재가 조금 남는데, 이것을 회분이라고 합니다. 껍질에는 무기질이 많아서 껍질이 많이 섞일수록 회분이 늘어납니다. 흰 밀가루 100g은 회분이 약 0.4g, 밀알을 통째로 간 가루는 약 2g 넘게 남습니다. 독일은 이 양을 숫자로 붙여 405(흰 가루)부터 1600(짙은 통곡물 가루)까지, 프랑스는 45부터 150까지로 나눕니다.</p>' +
      entryLink('ash-grade', '회분 등급') + '</div></div>';
  }

  /* ---------------- 동작 연결 ---------------- */

  function wireToggle(root, itemSel, btnSel, bodySel, onOpen) {
    Array.prototype.forEach.call(root.querySelectorAll(itemSel), function (item) {
      var btn = item.querySelector(btnSel);
      var body = item.querySelector(bodySel);
      btn.addEventListener('click', function () {
        var open = !item.classList.contains('fg-open');
        item.classList.toggle('fg-open', open);
        btn.setAttribute('aria-expanded', String(open));
        body.hidden = !open;
        if (open && onOpen) onOpen(item);
      });
    });
  }

  function showPart(root, key) {
    var p = PARTS[key];
    if (!p) return;
    var anat = root.querySelector('.fg-anat');
    anat.classList.add('fg-sel');
    Array.prototype.forEach.call(anat.querySelectorAll('.fg-part'), function (g) {
      g.classList.toggle('fg-hl', g.getAttribute('data-part') === key);
    });
    Array.prototype.forEach.call(anat.querySelectorAll('.fg-pbtns .fg-pill'), function (b) {
      var on = b.getAttribute('data-part') === key;
      b.classList.toggle('fg-on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    anat.querySelector('.fg-pinfo').innerHTML =
      '<h3>' + chip(p.icon) + '<span>' + esc(p.name) + '</span><span class="fg-pct">' + esc(p.pct) + '</span></h3>' +
      '<p>' + esc(p.text) + '</p>' + entryLink(p.link, '밀알');
  }

  function animateBars(root) {
    var fills = root.querySelectorAll('.fg-fill');
    function go() {
      Array.prototype.forEach.call(fills, function (f) {
        f.style.width = f.getAttribute('data-w') + '%';
      });
    }
    var sec = root.querySelector('#guide-types');
    if ('IntersectionObserver' in window && sec) {

    if(window.FlourVideo && typeof window.FlourVideo.mount === 'function'){
      try{ var ph = $('videoPh'); if(ph) ph.remove(); window.FlourVideo.mount(box); }
      catch(err){ box.innerHTML = '<div class="video-ph"><div><p>영상을 불러오지 못했습니다.</p></div></div>'; }
    }
  })();

  /* ---------- favorites (key = id) ---------- */
  var favs = {};
  (store.get('flour-favs-v2', []) || []).forEach(function(l){ if(typeof l === 'string') favs[l] = true; });
  function saveFavs(){ store.set('flour-favs-v2', Object.keys(favs)); }
  function toggleFav(id){
    if(favs[id]) delete favs[id]; else favs[id] = true;
    saveFavs(); syncFavButtons(id); applyFilters();
  }
  function syncFavButtons(id){
    var on = !!favs[id];
    var cardBtn = sectionsEl.querySelector('.fav[data-id="' + id + '"]');
    if(cardBtn){
      cardBtn.setAttribute('aria-pressed', on); cardBtn.textContent = on ? STAR_ON : STAR_OFF;
      cardBtn.setAttribute('aria-label', (on ? '즐겨찾기에서 빼기: ' : '즐겨찾기에 넣기: ') + cardBtn.getAttribute('data-title'));
    }
    if(current >= 0 && data[current].id === id){
      $('dFav').setAttribute('aria-pressed', on); $('dFavLbl').textContent = on ? '즐겨찾기 됨' : '즐겨찾기';
      $('dFavStar').textContent = on ? STAR_ON : STAR_OFF;
    }
  }

  /* ---------- build sections & tabs ---------- */
  var sectionsEl = $('sections'), catBar = $('catBar');
  function renderSections(){
    if(!N){
      $('empty').hidden = false;
      $('empty').querySelector('h2').textContent = '표제어를 준비하고 있습니다';
      $('emptyMsg').textContent = '잠시 뒤에 다시 열어 주세요.';
      $('resetBtn').hidden = true;
      return;
    }
    sectionsEl.innerHTML = CATS.map(function(c, ci){
      var items = data.map(function(e, i){ return e.ci === ci ? i : -1; }).filter(function(i){ return i >= 0; });
      if(!items.length) return '';
      return '<section class="topic ' + ct(ci) + '" id="topic-' + ci + '" data-ci="' + ci + '" aria-labelledby="topic-h-' + ci + '">' +
        '<div class="topic-head">' +
          '<span class="topic-tile" aria-hidden="true">' + ico(c.svg) + '</span>' +
          '<div class="topic-tt"><h2 id="topic-h-' + ci + '">' + esc(c.name) + '</h2>' + (c.blurb ? '<p>' + esc(c.blurb) + '</p>' : '') + '</div>' +
          '<span class="topic-n" data-n="' + ci + '">표제어 ' + items.length + '개</span>' +
        '</div>' +
        '<ul class="grid">' + items.map(function(i){ return cardHtml(data[i], i); }).join('') + '</ul>' +
      '</section>';
    }).join('');
    catBar.innerHTML = CATS.map(function(c, ci){
      return '<button type="button" class="cat-tab ' + ct(ci) + '" data-ci="' + ci + '"><span class="tt" aria-hidden="true">' + ico(c.svg) + '</span>' + esc(c.name) + '</button>';
    }).join('');
  }
  function cardHtml(e, i){
    var on = !!favs[e.id];
    return '<li class="card ' + ct(e.ci) + '" data-i="' + i + '">' +
      '<button class="card-open" type="button" data-i="' + i + '" aria-label="' + esc(e.title + (e.english ? ', ' + e.english : '') + ' 자세히 보기') + '">' +
        '<span class="card-top"><span class="tile" aria-hidden="true">' + ico(CATS[e.ci].svg) + '</span></span>' +
        '<span class="card-word">' + esc(e.title) + '</span>' +
        '<span class="card-en">' + esc(e.english) + '</span>' +
        '<span class="card-sum">' + esc(e.summary) + '</span>' +
        '<span class="chip ' + ct(e.ci) + '">' + ico(CATS[e.ci].svg) + ' ' + esc(e.category || '기타') + '</span>' +
      '</button>' +
      '<button class="fav" type="button" data-id="' + esc(e.id) + '" data-title="' + esc(e.title) + '" aria-pressed="' + on + '" aria-label="' + (on ? '즐겨찾기에서 빼기: ' : '즐겨찾기에 넣기: ') + esc(e.title) + '">' + (on ? STAR_ON : STAR_OFF) + '</button>' +
    '</li>';
  }
  sectionsEl.addEventListener('click', function(ev){
    var f = ev.target.closest('.fav'); if(f){ toggleFav(f.dataset.id); return; }
    var o = ev.target.closest('.card-open'); if(o){ openEntry(+o.dataset.i, o, true); }
  });

  /* ---------- tabs ---------- */
  function setActiveTab(ci){
    var prev = catBar.querySelector('.cat-tab.active');
    if(ci == null || ci < 0){
      if(prev){ prev.classList.remove('active'); prev.removeAttribute('aria-current'); }
      return;
    }
    if(prev && +prev.dataset.ci === ci) return;
    if(prev){ prev.classList.remove('active'); prev.removeAttribute('aria-current'); }
    var b = catBar.querySelector('.cat-tab[data-ci="' + ci + '"]');
    if(!b) return;
    b.classList.add('active'); b.setAttribute('aria-current', 'true');
    var left = b.offsetLeft - catBar.clientWidth / 2 + b.offsetWidth / 2;
    try{ catBar.scrollTo({left: left, behavior: 'smooth'}); }catch(e){ catBar.scrollLeft = left; }
  }
  catBar.addEventListener('click', function(ev){
    var b = ev.target.closest('.cat-tab'); if(!b || b.disabled) return;
    var sec = $('topic-' + b.dataset.ci); if(!sec || sec.hidden) return;
    setActiveTab(+b.dataset.ci);
    sec.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
  });
  var visSec = {};
  function pickActive(){
    var keys = Object.keys(visSec).map(Number).filter(function(ci){ var s = $('topic-' + ci); return s && !s.hidden; });
    if(keys.length){ setActiveTab(Math.min.apply(null, keys)); return; }
    var first = sectionsEl.querySelector('.topic:not([hidden])');
    if(!first || first.getBoundingClientRect().top > 200) setActiveTab(null);
  }
  function observeSections(){
    if(!('IntersectionObserver' in window) || !N) return;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        var ci = +en.target.dataset.ci;
        if(en.isIntersecting) visSec[ci] = true; else delete visSec[ci];
      });
      pickActive();
    }, { rootMargin: '-130px 0px -55% 0px', threshold: 0 });
    Array.prototype.forEach.call(sectionsEl.querySelectorAll('.topic'), function(s){ io.observe(s); });
  }

  /* ---------- filters ---------- */
  var state = { q: '', cat: '전체', cho: '', fav: false };
  var filtersEl = $('filters'), choEl = $('cho');
  ['전체'].concat(CATS.map(function(c){ return c.name; })).forEach(function(c, k){
    var b = document.createElement('button');
    b.type = 'button'; b.dataset.cat = c;
    var ci = c === '전체' ? -1 : k - 1;
    b.className = 'fchip ' + (ci < 0 ? 'all' : ct(ci));
    b.setAttribute('aria-pressed', c === '전체');
    b.innerHTML = '<span aria-hidden="true">' + ico(ci < 0 ? '' : CATS[ci].svg) + '</span>' + esc(c) + ' <span class="n">0</span>';
    filtersEl.appendChild(b);
  });
  filtersEl.addEventListener('click', function(ev){
    var b = ev.target.closest('.fchip'); if(!b || b.disabled) return;
    state.cat = (state.cat === b.dataset.cat) ? '전체' : b.dataset.cat; applyFilters();
  });
  var choHas = {};
  data.forEach(function(e){ if(e.cho) choHas[e.cho] = true; });
  CHO_LIST.forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'cho-btn'; b.dataset.cho = c; b.textContent = c;
    b.setAttribute('aria-pressed', 'false');
    if(!choHas[c]){ b.disabled = true; b.setAttribute('aria-label', c + ' 해당 표제어 없음'); }
    else b.setAttribute('aria-label', c + ' 으로 시작하는 표제어');
    choEl.appendChild(b);
  });
  choEl.addEventListener('click', function(ev){
    var b = ev.target.closest('.cho-btn'); if(!b || b.disabled) return;
    state.cho = state.cho === b.dataset.cho ? '' : b.dataset.cho; applyFilters();
  });
  var qEl = $('q'), qTimer;
  qEl.addEventListener('input', function(){
    clearTimeout(qTimer);
    qTimer = setTimeout(function(){ state.q = qEl.value.trim().toLowerCase(); $('clearQ').hidden = !qEl.value; applyFilters(); }, 120);
  });
  $('clearQ').addEventListener('click', function(){ qEl.value = ''; state.q = ''; $('clearQ').hidden = true; applyFilters(); qEl.focus(); });
  $('favOnly').addEventListener('click', function(){ state.fav = !state.fav; applyFilters(); });
  $('resetBtn').addEventListener('click', function(){ resetFilters(); qEl.focus(); });
  function resetFilters(){ state.q = ''; state.cat = '전체'; state.cho = ''; state.fav = false; qEl.value = ''; $('clearQ').hidden = true; applyFilters(); }

  function matchQ(e){
    if(!state.q) return true;
    return state.q.split(/\s+/).every(function(t){ return e.hay.indexOf(t) !== -1; });
  }
  function matchCho(e){ return !state.cho || e.cho === state.cho; }
  function matchFav(e){ return !state.fav || !!favs[e.id]; }
  function matchCat(e){ return state.cat === '전체' || e.category === state.cat; }

  function applyFilters(){
    if(!N){ return; }
    var cards = sectionsEl.querySelectorAll('.card'), shown = 0, perCat = {};
    Array.prototype.forEach.call(cards, function(card){
      var e = data[+card.dataset.i];
      var ok = matchQ(e) && matchFav(e) && matchCho(e) && matchCat(e);
      card.hidden = !ok;
      if(ok){ shown++; perCat[e.ci] = (perCat[e.ci] || 0) + 1; }
    });
    Array.prototype.forEach.call(sectionsEl.querySelectorAll('.topic'), function(sec){
      var ci = +sec.dataset.ci, n = perCat[ci] || 0;
      sec.hidden = n === 0;
      var lab = sec.querySelector('.topic-n');
      if(lab) lab.textContent = '표제어 ' + n + '개';
    });
    Array.prototype.forEach.call(catBar.children, function(b){
      var n = perCat[+b.dataset.ci] || 0;
      b.disabled = n === 0;
    });
    updateCounts();
    $('favOnly').setAttribute('aria-pressed', state.fav);
    Array.prototype.forEach.call(choEl.children, function(b){ b.setAttribute('aria-pressed', b.dataset.cho === state.cho); });
    var empty = $('empty');
    empty.hidden = shown > 0;
    if(!shown){
      $('emptyMsg').textContent = state.fav && !Object.keys(favs).length
        ? '즐겨찾기한 표제어가 없습니다. 카드의 별(☆)을 눌러 추가하세요.'
        : '다른 단어로 검색하거나 선택한 조건을 해제하세요.';
    }
    var parts = [];
    if(state.q) parts.push('“' + qEl.value.trim() + '”');
    if(state.cat !== '전체') parts.push(state.cat);
    if(state.cho) parts.push('초성 ' + state.cho);
    if(state.fav) parts.push('즐겨찾기');
    $('status').textContent = parts.length ? parts.join(' · ') + ' — 표제어 ' + shown + '개를 찾았습니다.' : '모두 ' + N + '개의 표제어가 있습니다.';
    pickActive();
  }
  function updateCounts(){
    var counts = {'전체': 0}; CATS.forEach(function(c){ counts[c.name] = 0; });
    data.forEach(function(e){ if(matchQ(e) && matchFav(e) && matchCho(e)){ counts['전체']++; counts[e.category]++; } });
    Array.prototype.forEach.call(filtersEl.children, function(b){
      var c = b.dataset.cat, on = c === state.cat;
      b.setAttribute('aria-pressed', on);
      b.querySelector('.n').textContent = counts[c];
      b.disabled = !on && counts[c] === 0;
      b.setAttribute('aria-label', c + ' ' + counts[c] + '개');
    });
  }

  /* ---------- modal ---------- */
  var modal = $('modal'), sheet = $('sheet'), detail = $('detail');
  var current = -1, opener = null;
  function setHash(id, push){
    if(location.hash === '#' + id) return;
    try{ history[push ? 'pushState' : 'replaceState'](null, '', '#' + id); }catch(e){}
  }
  function openEntry(i, from, push){
    if(i < 0 || i >= N) return;
    var wasOpen = current >= 0;
    if(!wasOpen){ opener = from || document.activeElement; }
    current = i; stopSpeak();
    renderDetail();
    if(!wasOpen){
      modal.hidden = false; document.body.classList.add('lock');
      setTimeout(function(){ $('closeBtn').focus(); }, 30);
    }
    sheet.scrollTop = 0;
    setHash(data[i].id, push && !wasOpen);
  }
  function hideModal(){
    if(current < 0) return null;
    stopSpeak();
    var id = data[current].id;
    current = -1; modal.hidden = true; document.body.classList.remove('lock');
    return id;
  }
  function closeModal(){
    var id = hideModal(); if(id == null) return;
    if(byId[location.hash.slice(1)] != null){ try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} }
    var back = opener && document.contains(opener) ? opener : document.querySelector('.fav[data-id="' + id + '"]');
    if(back && back.focus) back.focus({preventScroll: false});
    opener = null;
  }
  function renderDetail(){
    var e = data[current], cls = ct(e.ci), cat = CATS[e.ci];
    var rel = e.related.filter(function(r, k, arr){ return r !== e.id && arr.indexOf(r) === k && (r in byId); });
    detail.innerHTML =
      '<div class="d-hero ' + cls + '">' +
        '<div class="d-tile" aria-hidden="true">' + ico(cat.svg) + '</div>' +
        '<div class="d-titles">' +
          '<h2 class="d-word" id="dWord">' + esc(e.title) + '</h2>' +
          (e.english ? '<p class="d-en">' + esc(e.english) + '</p>' : '') +
          '<span class="chip ' + cls + '">' + ico(cat.svg) + ' ' + esc(e.category || '기타') + '</span>' +
        '</div>' +
      '</div>' +
      (e.summary ? '<p class="d-sum">' + esc(e.summary) + '</p>' : '') +
      '<div class="d-body">' + e.body.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</div>' +
      (e.facts.length ? '<div class="d-facts"><h3>한눈에 보기</h3><dl>' + e.facts.map(function(f){ return '<div><dt>' + esc(f.k) + '</dt><dd>' + esc(f.v) + '</dd></div>'; }).join('') + '</dl></div>' : '') +
      (e.more.length ? '<div class="d-more"><h3>더 알아보기</h3>' + e.more.map(function(m){ return '<details><summary>' + esc(m.t) + '</summary><p>' + esc(m.d) + '</p></details>'; }).join('') + '</div>' : '') +
      (e.words.length ? '<div class="d-words"><h3>낱말 풀이</h3><dl>' + e.words.map(function(w){ return '<div><dt>' + esc(w.w) + '</dt><dd>' + esc(w.m) + '</dd></div>'; }).join('') + '</dl></div>' : '') +
      (e.note ? '<div class="callout call-fun"><h3>알아 두면 좋은 사실</h3><p>' + esc(e.note) + '</p></div>' : '') +
      (e.tryIt ? '<div class="callout call-try"><h3>직접 해 보기</h3><p>' + esc(e.tryIt) + '</p></div>' : '') +
      (rel.length ? '<div class="related"><h3>함께 보면 좋은 표제어</h3><div class="rel-list">' + rel.map(function(r){
          var t = data[byId[r]];
          return '<button class="nbtn rel-btn ' + ct(t.ci) + '" type="button" data-id="' + esc(r) + '"><span class="b" aria-hidden="true">' + ico(CATS[t.ci].svg) + '</span>' + esc(t.title) + '</button>';
        }).join('') + '</div></div>' : '');
    var p = data[current - 1], n = data[current + 1];
    $('prevBtn').disabled = !p; $('nextBtn').disabled = !n;
    $('prevT').textContent = p ? p.title : '첫 표제어';
    $('nextT').textContent = n ? n.title : '마지막 표제어';
    $('prevBtn').setAttribute('aria-label', p ? '이전 표제어: ' + p.title : '이전 표제어 없음');
    $('nextBtn').setAttribute('aria-label', n ? '다음 표제어: ' + n.title : '다음 표제어 없음');
    syncFavButtons(e.id);
  }
  detail.addEventListener('click', function(ev){
    var r = ev.target.closest('.rel-btn'); if(r){ openEntry(byId[r.dataset.id]); $('closeBtn').focus(); }
  });
  $('closeBtn').addEventListener('click', closeModal);
  $('modalBg').addEventListener('click', closeModal);
  $('prevBtn').addEventListener('click', function(){ openEntry(current - 1); });
  $('nextBtn').addEventListener('click', function(){ openEntry(current + 1); });
  $('dFav').addEventListener('click', function(){ if(current >= 0) toggleFav(data[current].id); });
  document.addEventListener('keydown', function(ev){
    if(current < 0) return;
    if(ev.key === 'Escape'){ ev.preventDefault(); closeModal(); return; }
    if(ev.key === 'ArrowLeft' && current > 0){ ev.preventDefault(); openEntry(current - 1); return; }
    if(ev.key === 'ArrowRight' && current < N - 1){ ev.preventDefault(); openEntry(current + 1); return; }
    if(ev.key === 'Tab'){
      var f = Array.prototype.filter.call(sheet.querySelectorAll('button,[href],input,summary,[tabindex]:not([tabindex="-1"])'), function(el){ return !el.disabled && !el.hidden && el.offsetParent !== null; });
      if(!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if(ev.shiftKey && (document.activeElement === first || !sheet.contains(document.activeElement))){ ev.preventDefault(); last.focus(); }
      else if(!ev.shiftKey && (document.activeElement === last || !sheet.contains(document.activeElement))){ ev.preventDefault(); first.focus(); }
    }
  });

  /* ---------- speech ---------- */
  var synth = window.speechSynthesis, speaking = false;
  var canSpeak = !!(synth && window.SpeechSynthesisUtterance);
  if(canSpeak) $('speakBtn').hidden = false;
  function koVoice(){ try{ var v = synth.getVoices(); for(var i = 0; i < v.length; i++){ if(/^ko/i.test(v[i].lang)) return v[i]; } }catch(e){} return null; }
  function setSpeakUI(on){ speaking = on; $('speakBtn').setAttribute('aria-pressed', on); $('speakLbl').textContent = on ? '멈추기' : '읽어주기'; }
  function stopSpeak(){ if(canSpeak){ try{ synth.cancel(); }catch(e){} } if(speaking) setSpeakUI(false); }
  $('speakBtn').addEventListener('click', function(){
    if(!canSpeak || current < 0) return;
    if(speaking){ stopSpeak(); return; }
    var e = data[current];
    var chunks = [e.title + '.', e.summary].concat(e.body);
    if(e.note) chunks.push('알아 두면 좋은 사실. ' + e.note);
    if(e.tryIt) chunks.push('직접 해 보기. ' + e.tryIt);
    chunks = chunks.filter(Boolean);
    try{ synth.cancel(); }catch(err){}
    var voice = koVoice();
    setSpeakUI(true);
    chunks.forEach(function(text, k){
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = 0.92; u.pitch = 1.05; if(voice) u.voice = voice;
      if(k === chunks.length - 1){ u.onend = function(){ setSpeakUI(false); }; }
      u.onerror = function(){ setSpeakUI(false); };
      synth.speak(u);
    });
  });

  /* ---------- random ---------- */
  $('randomBtn').addEventListener('click', function(ev){ if(N) openEntry(rand(N), ev.currentTarget, true); });
  if(!N) $('randomBtn').disabled = true;

  /* ---------- back to top ---------- */
  var toTop = $('toTop'), ticking = false;
  window.addEventListener('scroll', function(){
    if(ticking) return; ticking = true;
    requestAnimationFrame(function(){ toTop.classList.toggle('show', window.scrollY > 600); ticking = false; });
  }, {passive: true});
  toTop.addEventListener('click', function(){ window.scrollTo({top: 0, behavior: 'smooth'}); });

  /* ---------- hash deep links (#id). 'guide-' 로 시작하는 해시는 총론 영역 몫이라 무시 ---------- */
  function hashId(){
    var h = location.hash || '';
    if(h.length < 2) return '';
    try{ h = decodeURIComponent(h.slice(1)); }catch(e){ h = h.slice(1); }
    return h;
  }
  function fromHash(initial){
    var id = hashId();
    if(id.indexOf('guide-') === 0) return;
    if(id && byId[id] != null){
      var i = byId[id];
      if(current === i) return;
      var card = sectionsEl.querySelector('.card[data-i="' + i + '"] .card-open');
      if(initial && card){ var c = card.closest('.card'); if(c.hidden) resetFilters(); c.scrollIntoView({block: 'center'}); }
      openEntry(i, card);
    } else if(current >= 0){
      var gone = hideModal();
      var back = opener && document.contains(opener) ? opener : null;
      if(back) back.focus({preventScroll: true});
      opener = null;
    }
  }
  window.addEventListener('hashchange', function(){ fromHash(false); });

  /* ---------- init ---------- */
  renderSections();
  applyFilters();
  observeSections();
  if(N) fromHash(true);
})();
</script>
<script>try{window.FlourGuide&&FlourGuide.mount(document.getElementById("guide"))}catch(e){console.error(e)}</script>
</body>
</html>
